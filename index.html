<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SCP Quantum" />

  <title>SCP Quantum</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; min-height: 100vh; min-height: -webkit-fill-available; background: #000; color: #aaa; font-family: 'Courier New', monospace; overflow-x: hidden; }
    .app { display: flex; flex-direction: column; height: 100%; min-height: 100vh; min-height: -webkit-fill-available; max-width: 480px; margin: 0 auto; position: relative; 
      padding-top: env(safe-area-inset-top); 
      padding-bottom: calc(env(safe-area-inset-bottom) + 8px); 
      padding-left: env(safe-area-inset-left); 
      padding-right: env(safe-area-inset-right); 
      background: inherit;
    }
    
    /* Glitch overlay */
    .edge-glow { position: fixed; inset: 0; pointer-events: none; z-index: 200; box-shadow: inset 0 0 40px rgba(180,180,180,0.12), inset 0 0 80px rgba(160,160,160,0.06); }
    .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99; opacity: 0.04; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }

    header { padding: 20px 16px 10px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); text-align: center; background: linear-gradient(180deg, #0a0a0a, #111); position: relative; overflow: hidden; }
    .brand-switch { transition: transform 0.2s, box-shadow 0.2s; }
    .brand-switch:hover { transform: scale(1.08); box-shadow: 0 0 12px rgba(180,180,180,0.5) !important; }
    .brand-switch:active { transform: scale(0.95); }
    .glitch { position: relative; font-size: 1.8rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; animation: glitch 2.5s infinite; text-shadow: 0 0 12px rgba(180,180,180,0.4); }
    .glitch::before, .glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .glitch::before { left: 2px; text-shadow: -2px 0 #666; clip: rect(24px, 550px, 90px, 0); animation: glitch-anim 2s infinite linear alternate-reverse; }
    .glitch::after { left: -2px; text-shadow: -2px 0 #ccc; clip: rect(85px, 550px, 140px, 0); animation: glitch-anim2 3s infinite linear alternate-reverse; }
    @keyframes glitch { 0%, 100% { text-shadow: 2px 0 #666, -2px 0 #ccc; } 50% { text-shadow: -2px 0 #666, 2px 0 #ccc; } }
    @keyframes glitch-anim { 0% { clip: rect(31px, 9999px, 94px, 0); } 20% { clip: rect(62px, 9999px, 42px, 0); } 40% { clip: rect(16px, 9999px, 78px, 0); } 60% { clip: rect(89px, 9999px, 13px, 0); } 80% { clip: rect(45px, 9999px, 67px, 0); } 100% { clip: rect(12px, 9999px, 99px, 0); } }
    @keyframes glitch-anim2 { 0% { clip: rect(65px, 9999px, 100px, 0); } 25% { clip: rect(28px, 9999px, 55px, 0); } 50% { clip: rect(92px, 9999px, 21px, 0); } 75% { clip: rect(14px, 9999px, 83px, 0); } 100% { clip: rect(47px, 9999px, 39px, 0); } }

    .tagline { font-size: 0.75rem; opacity: 0.6; margin-top: 4px; letter-spacing: 1px; }

    .logo::before, .logo::after { content: ''; position: absolute; inset: 0; background: inherit; background-size: contain; mix-blend-mode: screen; }
    .logo::before { animation: glitchShift 2.2s infinite; filter: hue-rotate(90deg); opacity: 0.7; }
    .logo::after { animation: glitchShift2 2.8s infinite reverse; filter: hue-rotate(-90deg); opacity: 0.6; }
    @keyframes logoGlitch { 0%, 100% { transform: translate(0); } 20% { transform: translate(-2px, 1px); } 40% { transform: translate(2px, -1px); } 60% { transform: translate(-1px, -2px); } 80% { transform: translate(1px, 2px); } }
    @keyframes glitchShift { 0% { clip-path: inset(20% 0 50% 0); transform: translate(3px, 0); } 20% { clip-path: inset(60% 0 10% 0); transform: translate(-3px, 1px); } 40% { clip-path: inset(10% 0 70% 0); transform: translate(2px, -2px); } 60% { clip-path: inset(40% 0 30% 0); transform: translate(-2px, 0); } 80% { clip-path: inset(70% 0 5% 0); transform: translate(1px, 1px); } 100% { clip-path: inset(15% 0 65% 0); transform: translate(0); } }
    @keyframes glitchShift2 { 0% { clip-path: inset(50% 0 20% 0); transform: translate(-3px, 0); } 25% { clip-path: inset(10% 0 60% 0); transform: translate(3px, -1px); } 50% { clip-path: inset(70% 0 10% 0); transform: translate(-2px, 2px); } 75% { clip-path: inset(30% 0 40% 0); transform: translate(2px, 0); } 100% { clip-path: inset(65% 0 15% 0); transform: translate(0); } }

    .controls { padding: 12px 16px; background: rgba(10,10,10,0.95); display: flex; flex-direction: column; gap: 12px; border-top: 2px solid #444; border-bottom: 2px solid #444; }
    input[type="text"] { padding: 12px; border-radius: 4px; border: 1px solid #555; background: #000; color: #ccc; font-family: inherit; font-size: 0.9rem; width: 100%; outline: none; }
    input[type="text"]:focus { border-color: #888; box-shadow: 0 0 8px #444; }
    label { font-size: 0.85rem; display: flex; flex-direction: column; gap: 6px; letter-spacing: 0.5px; color: #aaa; }
    input[type="range"] { width: 100%; accent-color: #888; height: 4px; }
    .buttons { display: flex; gap: 8px; }
    button { flex: 1; padding: 12px 6px; border: 1px solid #666; border-radius: 4px; background: transparent; color: #ccc; font-family: inherit; font-weight: 600; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; position: relative; overflow: hidden; transition: all 0.2s; box-shadow: 0 0 8px rgba(160,160,160,0.15); }
    button:hover:not(:disabled) { background: #222; box-shadow: 0 0 16px rgba(180,180,180,0.35); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:active { transform: scale(0.97); }
    .status { text-align: center; font-size: 0.8rem; opacity: 0.7; min-height: 1.2em; font-family: inherit; }

    .result { padding: 12px 16px; background: #0a0a0a; text-align: center; border-top: 2px solid #444; flex-shrink: 0; }
    .map-wrap { flex: 1; min-height: 180px; position: relative; border-top: 2px solid #444; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .actions button { background: #111; border-color: #555; color: #aaa; }
    footer { padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 0.7rem; opacity: 0.5; background: inherit; color: #666; flex-shrink: 0; }
    .leaflet-container { background: #000 !important; height: 100%; width: 100%; filter: grayscale(100%) contrast(1.3) brightness(0.85); }
    .theme-toggle { border: 1px solid #666 !important; background: transparent !important; color: #aaa !important; letter-spacing: 1px; box-shadow: 0 0 8px rgba(160,160,160,0.2) !important; }
    .app.light { background: #f0f0f0; color: #222; }
    .app.light header { background: linear-gradient(180deg, #e8e8e8, #f5f5f5); color: #111; }
    .app.light .controls { background: rgba(240,240,240,0.95); border-color: #ccc; }
    .app.light input[type="text"] { background: #fff; color: #222; border-color: #aaa; }
    .app.light button { color: #333; border-color: #888; }
    .app.light button:hover:not(:disabled) { background: #e0e0e0; }
    .app.light .map-wrap { border-color: #ccc; }
    .app.light .result { background: #f5f5f5; border-color: #ccc; color: #222; }
    .app.light footer { background: #f0f0f0; color: #555; }
    .app.light .leaflet-container { filter: grayscale(100%) contrast(1.1) brightness(1.05); }
    .app.light .glitch { color: #111; text-shadow: 0 0 10px rgba(100,100,100,0.3); }
    .app.light .logo { filter: drop-shadow(0 0 10px rgba(80,80,80,0.4)); }
    .app.light button { box-shadow: 0 0 6px rgba(120,120,120,0.2); }
    .app.light button:hover:not(:disabled) { box-shadow: 0 0 12px rgba(100,100,100,0.3); }
    .app.randonaut { background: #1a120b; color: #e8d5b5; }

<body>
  <div class="scanlines"></div>
  <div class="noise"></div>
  <div class="edge-glow"></div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const { useState, useEffect, useCallback, useRef } = React;

    function secureRandom() {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return arr[0] / (0xffffffff + 1);
    }

    function randomPointInRadius(lat, lon, radiusMeters) {
      const earthRadius = 6371000;
      const r = radiusMeters * Math.sqrt(secureRandom());
      const theta = secureRandom() * 2 * Math.PI;
      const dLat = (r * Math.cos(theta)) / earthRadius;
      const dLon = (r * Math.sin(theta)) / (earthRadius * Math.cos((lat * Math.PI) / 180));
      return {
        lat: lat + (dLat * 180) / Math.PI,
        lon: lon + (dLon * 180) / Math.PI,
      };
    }

    function findDensityPoint(lat, lon, radiusMeters, type, sampleCount = 500) {
      const points = [];
      for (let i = 0; i < sampleCount; i++) {
        points.push(randomPointInRadius(lat, lon, radiusMeters));
      }
      const neighborhood = radiusMeters * 0.18;
      let best = points[0];
      let bestScore = type === 'attractor' ? -Infinity : Infinity;

      for (const p of points) {
        let count = 0;
        for (const q of points) {
          const dLat = (p.lat - q.lat) * (Math.PI / 180) * 6371000;
          const dLon = (p.lon - q.lon) * (Math.PI / 180) * 6371000 * Math.cos((p.lat * Math.PI) / 180);
          const dist = Math.sqrt(dLat * dLat + dLon * dLon);
          if (dist < neighborhood) count++;
        }
        if (type === 'attractor' && count > bestScore) {
          bestScore = count;
          best = p;
        } else if (type === 'void' && count < bestScore) {
          bestScore = count;
          best = p;
        }
      }
      return best;
    }

    function App() {
      const [position, setPosition] = useState(null);
      const [radius, setRadius] = useState(2000);
      const [intention, setIntention] = useState('');
      const [target, setTarget] = useState(null);
      const [status, setStatus] = useState('Locating…');
      const [loading, setLoading] = useState(false);
      const [theme, setTheme] = useState('dark');
      const [brand, setBrand] = useState('scp');
      const mapRef = useRef(null);
      const mapInstance = useRef(null);
      const circleRef = useRef(null);
      const targetMarker = useRef(null);

      useEffect(() => {
        if (!navigator.geolocation) {
          setStatus('Geolocation not supported');
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const coords = [pos.coords.latitude, pos.coords.longitude];
            setPosition(coords);
            setStatus('Ready');
          },
          (err) => setStatus('Location permission denied or error'),
          { enableHighAccuracy: true, timeout: 15000 }
        );
      }, []);

      useEffect(() => {
        if (!position || !mapRef.current || mapInstance.current) return;

        const map = L.map(mapRef.current, { zoomControl: true, attributionControl: false }).setView(position, 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '',
          maxZoom: 19
        }).addTo(map);

        L.marker(position).addTo(map).bindPopup('You are here');
        circleRef.current = L.circle(position, {
          radius: radius,
          color: '#888',
          fillColor: '#666',
          fillOpacity: 0.08,
          weight: 1
        }).addTo(map);

        mapInstance.current = map;
        const fixSize = () => { if (map) map.invalidateSize(); };
        // Multiple attempts + ResizeObserver for PWA reliability
        setTimeout(fixSize, 100);
        setTimeout(fixSize, 400);
        setTimeout(fixSize, 1000);
        setTimeout(fixSize, 2000);
        window.addEventListener('resize', fixSize);
        window.addEventListener('orientationchange', fixSize);
        if (window.ResizeObserver) {
          const ro = new ResizeObserver(fixSize);
          ro.observe(mapRef.current);
        }
      }, [position]);

      useEffect(() => {
        if (circleRef.current) {
          circleRef.current.setRadius(radius);
        }
      }, [radius]);

      useEffect(() => {
        if (!mapInstance.current || !target) return;
        if (targetMarker.current) {
          mapInstance.current.removeLayer(targetMarker.current);
        }
        targetMarker.current = L.marker([target.lat, target.lon])
          .addTo(mapInstance.current)
          .bindPopup(intention ? `Intention: ${intention}` : 'Random point');
        mapInstance.current.panTo([target.lat, target.lon]);
      }, [target, intention]);

      const generate = useCallback((type) => {
        if (!position) return;
        setLoading(true);
        setStatus(`Generating ${type}…`);
        setTimeout(() => {
          const [lat, lon] = position;
          let point;
          if (type === 'blind') {
            point = randomPointInRadius(lat, lon, radius);
          } else {
            point = findDensityPoint(lat, lon, radius, type);
          }
          setTarget(point);
          setStatus(`${type.charAt(0).toUpperCase() + type.slice(1)} ready`);
          setLoading(false);
        }, 40);
      }, [position, radius]);

      const openInMaps = (service) => {
        if (!target) return;
        const url = service === 'apple'
          ? `https://maps.apple.com/?daddr=${target.lat},${target.lon}&dirflg=w`
          : `https://www.google.com/maps/dir/?api=1&destination=${target.lat},${target.lon}&travelmode=walking`;
        window.open(url, '_blank');
      };

      return React.createElement('div', { className: `app ${theme} ${brand}` },
        React.createElement('header', null,
          React.createElement('div', { className: brand === 'scp' ? 'glitch' : 'rando-title', 'data-text': brand === 'scp' ? 'SCP QUANTUM' : 'RANDONAUT' }, brand === 'scp' ? 'SCP QUANTUM' : 'RANDONAUT'),
          React.createElement('p', { className: 'tagline' }, brand === 'scp' ? 'SECURE. CONTAIN. PROTECT.' : 'EXPLORE THE UNKNOWN'),
          React.createElement('div', { style: { display: 'flex', gap: '8px', justifyContent: 'center', marginTop: '8px', flexWrap: 'wrap' } },
            React.createElement('button', {
              className: 'theme-toggle',
              onClick: () => setTheme(theme === 'dark' ? 'light' : 'dark'),
              style: { padding: '6px 14px', fontSize: '0.75rem' }
            }, theme === 'dark' ? 'LIGHT MODE' : 'DARK MODE')
          )
        ),
        React.createElement('button', {
          className: 'brand-switch',
          onClick: () => setBrand(brand === 'scp' ? 'randonaut' : 'scp'),
          title: brand === 'scp' ? 'Switch to Randonaut' : 'Switch to SCP',
          style: {
            position: 'absolute',
            top: '12px',
            right: '12px',
            width: '42px',
            height: '42px',
            borderRadius: '50%',

        position && React.createElement('div', { className: 'map-wrap', ref: mapRef }),
        target && React.createElement('div', { className: 'result' },
