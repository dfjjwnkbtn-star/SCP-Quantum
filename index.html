<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RandoExplore" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>RandoExplore</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    #root { height: 100%; }
    .app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; }
    header { padding: 16px 16px 8px; text-align: center; background: #1e293b; }
    header h1 { font-size: 1.4rem; font-weight: 600; }
    .tagline { font-size: 0.85rem; opacity: 0.7; margin-top: 2px; }
    .controls { padding: 12px 16px; background: #1e293b; display: flex; flex-direction: column; gap: 10px; }
    input[type="text"] { padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 0.95rem; width: 100%; }
    label { font-size: 0.9rem; display: flex; flex-direction: column; gap: 4px; }
    input[type="range"] { width: 100%; accent-color: #38bdf8; }
    .buttons { display: flex; gap: 8px; }
    button { flex: 1; padding: 12px 8px; border: none; border-radius: 8px; background: #38bdf8; color: #0f172a; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:active { transform: scale(0.98); }
    .status { text-align: center; font-size: 0.85rem; opacity: 0.8; min-height: 1.2em; }
    .map-wrap { flex: 1; min-height: 240px; position: relative; }
    .result { padding: 12px 16px; background: #1e293b; text-align: center; }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    .actions button { background: #475569; color: #e2e8f0; }
    footer { padding: 8px 16px 16px; text-align: center; font-size: 0.75rem; opacity: 0.6; background: #0f172a; }
    .leaflet-container { background: #0f172a; height: 100%; width: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const { useState, useEffect, useCallback, useRef } = React;

    function secureRandom() {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return arr[0] / (0xffffffff + 1);
    }

    function randomPointInRadius(lat, lon, radiusMeters) {
      const earthRadius = 6371000;
      const r = radiusMeters * Math.sqrt(secureRandom());
      const theta = secureRandom() * 2 * Math.PI;
      const dLat = (r * Math.cos(theta)) / earthRadius;
      const dLon = (r * Math.sin(theta)) / (earthRadius * Math.cos((lat * Math.PI) / 180));
      return {
        lat: lat + (dLat * 180) / Math.PI,
        lon: lon + (dLon * 180) / Math.PI,
      };
    }

    function findDensityPoint(lat, lon, radiusMeters, type, sampleCount = 500) {
      const points = [];
      for (let i = 0; i < sampleCount; i++) {
        points.push(randomPointInRadius(lat, lon, radiusMeters));
      }
      const neighborhood = radiusMeters * 0.18;
      let best = points[0];
      let bestScore = type === 'attractor' ? -Infinity : Infinity;

      for (const p of points) {
        let count = 0;
        for (const q of points) {
          const dLat = (p.lat - q.lat) * (Math.PI / 180) * 6371000;
          const dLon = (p.lon - q.lon) * (Math.PI / 180) * 6371000 * Math.cos((p.lat * Math.PI) / 180);
          const dist = Math.sqrt(dLat * dLat + dLon * dLon);
          if (dist < neighborhood) count++;
        }
        if (type === 'attractor' && count > bestScore) {
          bestScore = count;
          best = p;
        } else if (type === 'void' && count < bestScore) {
          bestScore = count;
          best = p;
        }
      }
      return best;
    }

    function App() {
      const [position, setPosition] = useState(null);
      const [radius, setRadius] = useState(2000);
      const [intention, setIntention] = useState('');
      const [target, setTarget] = useState(null);
      const [status, setStatus] = useState('Locating…');
      const [loading, setLoading] = useState(false);
      const mapRef = useRef(null);
      const mapInstance = useRef(null);
      const circleRef = useRef(null);
      const targetMarker = useRef(null);

      useEffect(() => {
        if (!navigator.geolocation) {
          setStatus('Geolocation not supported');
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const coords = [pos.coords.latitude, pos.coords.longitude];
            setPosition(coords);
            setStatus('Ready');
          },
          (err) => setStatus('Location permission denied or error'),
          { enableHighAccuracy: true, timeout: 15000 }
        );
      }, []);

      // Initialize map once we have position and the div is mounted
      useEffect(() => {
        if (!position || !mapRef.current || mapInstance.current) return;

        const map = L.map(mapRef.current, { zoomControl: true }).setView(position, 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors',
          maxZoom: 19
        }).addTo(map);

        L.marker(position).addTo(map).bindPopup('You are here');
        circleRef.current = L.circle(position, {
          radius: radius,
          color: '#38bdf8',
          fillColor: '#38bdf8',
          fillOpacity: 0.08,
          weight: 2
        }).addTo(map);

        mapInstance.current = map;
        setTimeout(() => map.invalidateSize(), 100);
      }, [position]);

      // Update circle when radius changes
      useEffect(() => {
        if (circleRef.current) {
          circleRef.current.setRadius(radius);
        }
      }, [radius]);

      // Update target marker
      useEffect(() => {
        if (!mapInstance.current || !target) return;
        if (targetMarker.current) {
          mapInstance.current.removeLayer(targetMarker.current);
        }
        targetMarker.current = L.marker([target.lat, target.lon])
          .addTo(mapInstance.current)
          .bindPopup(intention ? `Intention: ${intention}` : 'Random point');
        mapInstance.current.panTo([target.lat, target.lon]);
      }, [target, intention]);

      const generate = useCallback((type) => {
        if (!position) return;
        setLoading(true);
        setStatus(`Generating ${type}…`);
        setTimeout(() => {
          const [lat, lon] = position;
          let point;
          if (type === 'blind') {
            point = randomPointInRadius(lat, lon, radius);
          } else {
            point = findDensityPoint(lat, lon, radius, type);
          }
          setTarget(point);
          setStatus(`${type.charAt(0).toUpperCase() + type.slice(1)} ready`);
          setLoading(false);
        }, 40);
      }, [position, radius]);

      const openInMaps = (service) => {
        if (!target) return;
        const url = service === 'apple'
          ? `https://maps.apple.com/?daddr=${target.lat},${target.lon}&dirflg=w`
          : `https://www.google.com/maps/dir/?api=1&destination=${target.lat},${target.lon}&travelmode=walking`;
        window.open(url, '_blank');
      };

      return React.createElement('div', { className: 'app' },
        React.createElement('header', null,
          React.createElement('h1', null, 'RandoExplore'),
          React.createElement('p', { className: 'tagline' }, 'Personal random exploration')
        ),
        React.createElement('div', { className: 'controls' },
          React.createElement('input', {
            type: 'text',
            placeholder: 'Intention (optional) — e.g. water, surprise, quiet…',
            value: intention,
            onChange: (e) => setIntention(e.target.value)
          }),
          React.createElement('label', null,
            `Radius: ${(radius / 1000).toFixed(1)} km`,
            React.createElement('input', {
              type: 'range',
              min: 500,
              max: 10000,
              step: 100,
              value: radius,
              onChange: (e) => setRadius(Number(e.target.value))
            })
          ),
          React.createElement('div', { className: 'buttons' },
            React.createElement('button', { disabled: !position || loading, onClick: () => generate('blind') }, 'Blind Spot'),
            React.createElement('button', { disabled: !position || loading, onClick: () => generate('attractor') }, 'Attractor'),
            React.createElement('button', { disabled: !position || loading, onClick: () => generate('void') }, 'Void')
          ),
          React.createElement('p', { className: 'status' }, status)
        ),
        position && React.createElement('div', { className: 'map-wrap', ref: mapRef }),
        target && React.createElement('div', { className: 'result' },
          React.createElement('p', null,
            React.createElement('strong', null, `${target.lat.toFixed(6)}, ${target.lon.toFixed(6)}`)
          ),
          React.createElement('div', { className: 'actions' },
            React.createElement('button', { onClick: () => openInMaps('apple') }, 'Open in Apple Maps'),
            React.createElement('button', { onClick: () => openInMaps('google') }, 'Open in Google Maps')
          )
        ),
        React.createElement('footer', null,
          React.createElement('small', null, 'Add to Home Screen for the best experience. Be safe — respect private property.')
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
